<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Tournées TPMC</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#eef2f5; }
  #map { position:absolute; inset:0; }
  header { position:absolute; z-index:1000; top:0; left:0; right:0; padding:10px 12px;
           background:linear-gradient(180deg,rgba(18,50,79,.95),rgba(18,50,79,.82));
           color:#fff; display:flex; align-items:center; gap:10px; box-shadow:0 2px 8px rgba(0,0,0,.25); }
  header h1 { font-size:14px; margin:0; font-weight:600; line-height:1.2; }
  header .sub { font-size:11px; opacity:.85; margin-top:2px; }
  header button { margin-left:auto; background:rgba(255,255,255,.16); color:#fff; border:0; padding:8px 12px;
                  border-radius:20px; font-size:12px; font-weight:600; }
  #panel { position:absolute; z-index:1000; left:0; right:0; bottom:0; max-height:66vh; overflow:auto;
           background:#fff; border-radius:16px 16px 0 0; box-shadow:0 -4px 20px rgba(0,0,0,.18);
           transform:translateY(calc(100% - 118px)); transition:transform .22s ease; padding-bottom:8px; }
  #panel.open { transform:translateY(0); }
  #grab { padding:8px 0 4px; text-align:center; }
  #grab span { display:inline-block; width:44px; height:4px; border-radius:2px; background:#c9d2da; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:6px 12px 10px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; border:1px solid #dde3e9; background:#f7f9fb; border-radius:12px; padding:7px 10px;
          font-size:11px; color:#22364a; line-height:1.25; }
  .chip b { display:block; font-size:12px; }
  .chip.off { opacity:.42; }
  .chip .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  #liste { padding:0 12px 14px; }
  .sec { margin:16px 0 4px; }
  .sec .t { font-size:12px; font-weight:700; color:#12222f; }
  .sec .stats { font-size:11px; color:#5b6b7b; margin-top:2px; }
  .go { display:block; margin:8px 0 2px; padding:9px 12px; border-radius:10px; background:#12324f; color:#fff;
        text-decoration:none; font-size:12px; font-weight:600; text-align:center; }
  .go.alt { background:#2b4a68; }
  .row { display:flex; gap:10px; padding:10px 0; border-top:1px solid #eef2f5; align-items:flex-start; }
  .row .num { flex:0 0 24px; height:24px; border-radius:50%; color:#fff; font-size:12px; font-weight:700;
              display:flex; align-items:center; justify-content:center; }
  .row .txt { flex:1; min-width:0; }
  .row .n { font-size:13px; font-weight:600; color:#12222f; }
  .row .a { font-size:11px; color:#5b6b7b; margin-top:1px; }
  .row .m { font-size:12px; font-weight:700; color:#b23b3b; white-space:nowrap; }
  .row .leg { font-size:10px; color:#8a99a8; margin-top:2px; }
  .row .act { display:flex; gap:8px; margin-top:6px; }
  .row .act a { font-size:11px; text-decoration:none; padding:5px 9px; border-radius:8px; background:#eef4fa; color:#12324f; font-weight:600; }
  .row .act a.call { background:#eaf7ee; color:#1c6b34; }
  .leaflet-popup-content { margin:12px 14px; font-size:12px; }
  .pop h3 { margin:0 0 2px; font-size:14px; }
  .pop .amt { color:#b23b3b; font-weight:700; font-size:13px; }
  .pop .adr { color:#5b6b7b; margin:4px 0 8px; }
  .pop a.btn { display:inline-block; margin:6px 6px 0 0; padding:7px 11px; border-radius:8px;
               background:#12324f; color:#fff; text-decoration:none; font-size:12px; font-weight:600; }
  .pin { color:#fff; font-weight:700; font-size:11px; text-align:center; line-height:22px;
         width:22px; height:22px; border-radius:50%; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4); }
  footer { font-size:10px; color:#8a99a8; text-align:center; padding:6px 0 10px; }
  #fab { position:absolute; z-index:1200; left:12px; right:12px; bottom:130px; display:none;
         padding:14px 16px; border-radius:12px; background:#1c6b34; color:#fff; text-decoration:none;
         font-size:14px; font-weight:700; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.28); }
  #fab small { display:block; font-size:11px; font-weight:500; opacity:.85; margin-top:2px; }
  #gate { position:absolute; inset:0; z-index:2000; display:flex; align-items:center; justify-content:center;
          background:#12324f; color:#fff; padding:24px; text-align:center; }
  #gate .box { max-width:320px; }
  #gate h2 { font-size:17px; margin:0 0 6px; }
  #gate p { font-size:12px; opacity:.75; margin:0 0 16px; }
  #gate input { width:100%; padding:12px; border-radius:10px; border:0; font-size:16px; text-align:center; }
  #gate button { margin-top:10px; width:100%; padding:12px; border-radius:10px; border:0; background:#ffb703; color:#12324f;
                 font-weight:700; font-size:14px; }
  #gate .err { color:#ffc9c9; font-size:12px; margin-top:8px; min-height:16px; }
</style>
</head>
<body>
<div id="gate"><div class="box">
  <h2>Tournées impayés — accès protégé</h2>
  <p>Code d'accès fourni avec le lien.</p>
  <input id="code" inputmode="text" autocomplete="off" placeholder="CODE">
  <button id="go">Ouvrir la carte</button>
  <div class="err" id="err"></div>
</div></div>
<div id="map"></div>
<header>
  <div>
    <h1>Impayés incendie — tournées</h1>
    <div class="sub" id="sub"></div>
  </div>
  <button id="toggle">Liste</button>
</header>
<a id="fab" target="_blank" rel="noopener"></a>
<div id="panel">
  <div id="grab"><span></span></div>
  <div class="chips" id="chips"></div>
  <div id="liste"></div>
  <footer>Base TPMC Riom · ordre optimisé (OSRM) · distances routières</footer>
</div>

<script>const ITER = 150000;</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function dechiffrer(code) {
  const brut = b64(document.getElementById('blob').textContent.trim());
  const salt = brut.slice(0,16), nonce = brut.slice(16,28), ct = brut.slice(28);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256'}, base,
    {name:'AES-GCM', length:256}, false, ['decrypt']);
  const clair = await crypto.subtle.decrypt({name:'AES-GCM', iv:nonce}, key, ct);
  return JSON.parse(new TextDecoder().decode(clair));
}

// les libellés viennent de la base client : on échappe avant toute injection HTML
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const eur = v => v.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const hhmm = m => { const h = Math.floor(m/60), r = Math.round(m%60); return (h ? h + ' h ' : '') + (r ? r + ' min' : (h ? '' : '0 min')); };

function demarrer(DATA) {
  document.getElementById('gate').style.display = 'none';
  const map = L.map('map', {zoomControl:false}).setView([45.78,3.12], 10);
  L.control.zoom({position:'bottomright'}).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  const kmTot = DATA.secteurs.reduce((a,s)=>a+(s.km||0),0);
  document.getElementById('sub').textContent =
    DATA.points.length + ' clients · ' + eur(DATA.total) + ' · ' + DATA.secteurs.length +
    ' secteurs · ' + Math.round(kmTot) + ' km';

  const layers = {}, markers = {};
  DATA.secteurs.forEach(s => { layers[s.nom] = L.layerGroup().addTo(map); });

  // tracés des tournées
  DATA.routes.forEach(r => {
    if (!r.geo || !r.geo.length) return;
    L.polyline(r.geo.map(([lon,lat]) => [lat,lon]),
      {color:'#'+r.c, weight:4, opacity:0.62, lineJoin:'round'}).addTo(layers[r.s]);
  });

  function popupHTML(p) {
    const tel = (p.p || p.t || '').replace(/[^0-9+]/g,'');
    const leg = (p.km != null) ? `+${p.km.toFixed(1).replace('.',',')} km / ${p.min} min · cumul ${p.ckm.toFixed(1).replace('.',',')} km` : '';
    return `<div class="pop">
      <h3>${esc(p.n)}</h3>
      <div class="amt">${eur(p.m)} · ${esc(p.f.join(', '))}</div>
      <div class="adr">${esc(p.a || '')}<br>${esc(p.cp)} ${esc(p.v)}</div>
      ${p.k ? 'Contact : ' + esc(p.k) + '<br>' : ''}
      ${p.t ? 'Tél. ' + esc(p.t) + '<br>' : ''}${p.p ? 'Mobile ' + esc(p.p) : ''}
      <div style="color:#8a99a8;font-size:11px;margin-top:6px">${esc(p.s)} — arrêt n°${p.o} · retard ${p.r} j</div>
      ${leg ? '<div style="color:#5b6b7b;font-size:11px">' + leg + '</div>' : ''}
      <a class="btn" target="_blank" rel="noopener"
         href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}">Aller à cet arrêt</a>
      ${tel ? `<a class="btn" style="background:#1c6b34" href="tel:${tel}">Appeler</a>` : ''}
    </div>`;
  }

  DATA.points.forEach(p => {
    const ic = L.divIcon({className:'', html:`<div class="pin" style="background:#${p.c}">${p.o}</div>`,
                          iconSize:[22,22], iconAnchor:[11,11], popupAnchor:[0,-10]});
    markers[p.id] = L.marker([p.lat,p.lon], {icon:ic}).bindPopup(popupHTML(p)).addTo(layers[p.s]);
  });

  const actifs = new Set(DATA.secteurs.map(s => s.nom));
  function renderListe() {
    const box = document.getElementById('liste');
    let html = '';
    DATA.secteurs.filter(s => actifs.has(s.nom)).forEach(s => {
      const pts = DATA.points.filter(p => p.s === s.nom).sort((a,b)=>a.o-b.o);
      const r = DATA.routes.find(x => x.s === s.nom) || {};
      html += `<div class="sec">
        <div class="t"><span class="dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#${s.couleur};margin-right:6px"></span>${esc(s.nom)}</div>
        <div class="stats">${pts.length} arrêts · ${eur(s.du)} · ${(s.km||0).toFixed(0)} km · ${hhmm(s.min||0)} de conduite</div>`;
      const complet = (r.liens || []).find(l => l.type === 'complet');
      const depuisPos = (r.liens || []).find(l => l.type === 'position');
      if (complet) {
        html += `<a class="go" href="${complet.url}" target="_blank" rel="noopener">🧭 Démarrer la tournée — ${pts.length} arrêts · ${(s.km||0).toFixed(0)} km · ${hhmm(s.min||0)}</a>`;
      }
      if (depuisPos) {
        html += `<a class="go alt" style="background:#eef4fa;color:#12324f" href="${depuisPos.url}" target="_blank" rel="noopener">Depuis ma position actuelle (${pts.length} arrêts)</a>`;
      }
      html += '</div>';
      pts.forEach(p => {
        const tel = (p.p || p.t || '').replace(/[^0-9+]/g,'');
        const leg = (p.km != null) ? `+${p.km.toFixed(1).replace('.',',')} km · ${p.min} min · cumul ${p.ckm.toFixed(0)} km / ${hhmm(p.cmin)}` : '';
        html += `<div class="row">
          <div class="num" style="background:#${p.c}">${p.o}</div>
          <div class="txt">
            <div class="n">${esc(p.n)} <span class="m" style="float:right">${eur(p.m)}</span></div>
            <div class="a">${esc(p.a || '—')} · ${esc(p.cp)} ${esc(p.v)}</div>
            ${leg ? `<div class="leg">${leg}</div>` : ''}
            <div class="act">
              <a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}" target="_blank" rel="noopener">Arrêt seul</a>
              ${tel ? `<a class="call" href="tel:${tel}">Appeler</a>` : ''}
              <a href="#" data-go="${p.id}">Voir</a>
            </div>
          </div></div>`;
      });
    });
    box.innerHTML = html;
    box.querySelectorAll('[data-go]').forEach(a => a.addEventListener('click', e => {
      e.preventDefault();
      const p = DATA.points.find(x => x.id === a.dataset.go);
      map.setView([p.lat,p.lon], 16);
      markers[p.id].openPopup();
      document.getElementById('panel').classList.remove('open');
    }));
  }

  const chips = document.getElementById('chips');
  const toutes = DATA.points.map(p => [p.lat, p.lon]);
  const bornesSecteur = nom => L.latLngBounds(DATA.points.filter(p => p.s === nom).map(p => [p.lat, p.lon]));

  function majFab() {
    const fab = document.getElementById('fab');
    const seul = (actifs.size === 1) ? [...actifs][0] : null;
    const r = seul ? (DATA.routes.find(x => x.s === seul) || {}) : {};
    const l = seul ? (r.liens || []).find(x => x.type === 'complet') : null;
    if (!seul || !l) { fab.style.display = 'none'; fab.removeAttribute('href'); return; }
    const s = DATA.secteurs.find(x => x.nom === seul);
    fab.href = l.url;
    fab.innerHTML = `🧭 Démarrer la tournée<small>${esc(seul)} · ${s.n} arrêts · ${(s.km||0).toFixed(0)} km · ${hhmm(s.min||0)}</small>`;
    fab.style.display = 'block';
  }

  DATA.secteurs.forEach(s => {
    const d = document.createElement('div');
    d.className = 'chip';
    d.dataset.nom = s.nom;
    d.innerHTML = `<b><span class="dot" style="background:#${s.couleur}"></span>${esc(s.nom.split(' · ')[1] || s.nom)}</b>${s.n} arrêts · ${(s.km||0).toFixed(0)} km`;
    d.addEventListener('click', () => {
      const seul = (actifs.size === 1 && actifs.has(s.nom));
      if (seul) {                       // 2e appui : on réaffiche tous les secteurs
        actifs.clear();
        DATA.secteurs.forEach(x => { actifs.add(x.nom); layers[x.nom].addTo(map); });
        map.fitBounds(L.latLngBounds(toutes), {padding:[40,40]});
      } else {                          // 1er appui : on isole le secteur
        actifs.clear(); actifs.add(s.nom);
        DATA.secteurs.forEach(x => { if (x.nom === s.nom) layers[x.nom].addTo(map); else layers[x.nom].remove(); });
        map.fitBounds(bornesSecteur(s.nom), {padding:[45,45], maxZoom:14});
      }
      document.querySelectorAll('.chip').forEach(c => c.classList.toggle('off', !actifs.has(c.dataset.nom)));
      renderListe(); majFab();
    });
    chips.appendChild(d);
  });

  document.getElementById('toggle').addEventListener('click', () => {
    document.getElementById('panel').classList.toggle('open');
  });
  document.getElementById('grab').addEventListener('click', () => {
    document.getElementById('panel').classList.toggle('open');
  });

  const LocateCtl = L.Control.extend({
    options: {position:'bottomright'},
    onAdd: function() {
      const btn = L.DomUtil.create('div','leaflet-bar leaflet-control');
      btn.innerHTML = '<a href="#" title="Ma position" style="font-size:17px;line-height:26px;text-align:center;width:30px;height:30px;display:block">◎</a>';
      btn.onclick = e => { e.preventDefault();
        navigator.geolocation.getCurrentPosition(pos => {
          const ll = [pos.coords.latitude, pos.coords.longitude];
          if (window._me) map.removeLayer(window._me);
          window._me = L.circleMarker(ll, {radius:8, color:'#fff', weight:3, fillColor:'#1a73e8', fillOpacity:1}).addTo(map);
          map.setView(ll, 14);
        }, () => alert('Position indisponible'));
      };
      return btn;
    }
  });
  map.addControl(new LocateCtl());

  renderListe(); majFab();
  const ajuster = () => {
    map.invalidateSize();
    map.fitBounds(L.latLngBounds(DATA.points.map(p => [p.lat,p.lon])), {padding:[40,40]});
  };
  let cadre = false;
  const ro = new ResizeObserver(() => {
    map.invalidateSize();
    if (!cadre && map.getSize().x > 200) { ajuster(); cadre = true; }
  });
  ro.observe(document.getElementById('map'));
  setTimeout(() => { map.invalidateSize(); if (!cadre) { ajuster(); cadre = true; } }, 400);
  window.addEventListener('load', () => map.invalidateSize());
  window.addEventListener('resize', () => map.invalidateSize());
  window.addEventListener('orientationchange', () => setTimeout(() => map.invalidateSize(), 300));
}

async function tenter(code) {
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const data = await dechiffrer(code.trim().toUpperCase());
