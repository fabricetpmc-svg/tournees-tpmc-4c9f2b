<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Tournées TPMC</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#eef2f5; }
  #map { position:absolute; inset:0; }
  header { position:absolute; z-index:1000; top:0; left:0; right:0; padding:10px 12px;
           background:linear-gradient(180deg,rgba(18,50,79,.95),rgba(18,50,79,.82));
           color:#fff; display:flex; align-items:center; gap:10px; box-shadow:0 2px 8px rgba(0,0,0,.25); }
  header h1 { font-size:14px; margin:0; font-weight:600; line-height:1.2; }
  header .sub { font-size:11px; opacity:.88; margin-top:2px; }
  header button { margin-left:auto; background:rgba(255,255,255,.16); color:#fff; border:0; padding:8px 12px;
                  border-radius:20px; font-size:12px; font-weight:600; }
  #panel { position:absolute; z-index:1000; left:0; right:0; bottom:0; max-height:70vh; overflow:auto;
           background:#fff; border-radius:16px 16px 0 0; box-shadow:0 -4px 20px rgba(0,0,0,.18);
           transform:translateY(calc(100% - 118px)); transition:transform .22s ease; padding-bottom:8px; }
  #panel.open { transform:translateY(0); }
  #grab { padding:8px 0 4px; text-align:center; }
  #grab span { display:inline-block; width:44px; height:4px; border-radius:2px; background:#c9d2da; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:6px 12px 10px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; border:1px solid #dde3e9; background:#f7f9fb; border-radius:12px; padding:7px 10px;
          font-size:11px; color:#22364a; line-height:1.25; }
  .chip b { display:block; font-size:12px; }
  .chip.off { opacity:.42; }
  .chip .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  #liste { padding:0 12px 14px; }
  .sec { margin:16px 0 4px; }
  .sec .t { font-size:12px; font-weight:700; color:#12222f; }
  .sec .stats { font-size:11px; color:#5b6b7b; margin-top:2px; }
  .go { display:block; margin:8px 0 2px; padding:9px 12px; border-radius:10px; background:#12324f; color:#fff;
        text-decoration:none; font-size:12px; font-weight:600; text-align:center; }
  .go.alt { background:#eef4fa; color:#12324f; }
  .go.off { background:#e3e8ee; color:#8a99a8; pointer-events:none; }
  .row { display:flex; gap:10px; padding:10px 0; border-top:1px solid #eef2f5; align-items:flex-start; }
  .row .num { flex:0 0 24px; height:24px; border-radius:50%; color:#fff; font-size:12px; font-weight:700;
              display:flex; align-items:center; justify-content:center; }
  .row .txt { flex:1; min-width:0; }
  .row .n { font-size:13px; font-weight:600; color:#12222f; }
  .row .a { font-size:11px; color:#5b6b7b; margin-top:1px; }
  .row .m { font-size:12px; font-weight:700; color:#b23b3b; white-space:nowrap; }
  .row .leg { font-size:10px; color:#8a99a8; margin-top:2px; }
  .row .act { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .row .act a { font-size:11px; text-decoration:none; padding:5px 9px; border-radius:8px; background:#eef4fa; color:#12324f; font-weight:600; }
  .row .act a.call { background:#eaf7ee; color:#1c6b34; }
  .row .act a.paye { background:#1c6b34; color:#fff; }
  .row .act a.passe { background:#2b4a68; color:#fff; }
  .leaflet-popup-content { margin:12px 14px; font-size:12px; }
  .pop h3 { margin:0 0 2px; font-size:14px; }
  .pop .amt { color:#b23b3b; font-weight:700; font-size:13px; }
  .pop .adr { color:#5b6b7b; margin:4px 0 8px; }
  .pop a.btn { display:inline-block; margin:6px 6px 0 0; padding:7px 11px; border-radius:8px;
               background:#12324f; color:#fff; text-decoration:none; font-size:12px; font-weight:600; }
  .pop a.btn.paye { background:#1c6b34; } .pop a.btn.passe { background:#2b4a68; }
  .pin { color:#fff; font-weight:700; font-size:11px; text-align:center; line-height:22px;
         width:22px; height:22px; border-radius:50%; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4); }
  #fab { position:absolute; z-index:1200; left:12px; right:12px; bottom:130px; display:none;
         padding:14px 16px; border-radius:12px; background:#1c6b34; color:#fff; text-decoration:none;
         font-size:14px; font-weight:700; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.28); }
  #fab small { display:block; font-size:11px; font-weight:500; opacity:.85; margin-top:2px; }
  .traites { margin:12px 0 0; border-top:1px solid #eef2f5; padding-top:10px; }
  .traites .t { font-size:12px; font-weight:700; color:#12222f; display:flex; align-items:center; }
  .traites .t a { margin-left:auto; font-size:11px; color:#12324f; text-decoration:none; font-weight:600; }
  .tr { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:11px; color:#5b6b7b; }
  .tr b { color:#12222f; font-weight:600; }
  .tr .badge { flex:0 0 auto; font-size:10px; padding:2px 7px; border-radius:20px; color:#fff; }
  .tr a { margin-left:auto; font-size:11px; color:#12324f; text-decoration:none; font-weight:600; }
  footer { font-size:10px; color:#8a99a8; text-align:center; padding:6px 0 10px; }
  #gate { position:absolute; inset:0; z-index:2000; display:flex; align-items:center; justify-content:center;
          background:#12324f; color:#fff; padding:24px; text-align:center; }
  #gate .box { max-width:320px; }
  #gate h2 { font-size:17px; margin:0 0 6px; }
  #gate p { font-size:12px; opacity:.75; margin:0 0 16px; }
  #gate input { width:100%; padding:12px; border-radius:10px; border:0; font-size:16px; text-align:center; }
  #gate button { margin-top:10px; width:100%; padding:12px; border-radius:10px; border:0; background:#ffb703; color:#12324f;
                 font-weight:700; font-size:14px; }
  #gate .err { color:#ffc9c9; font-size:12px; margin-top:8px; min-height:16px; }
</style>
</head>
<body>
<div id="gate"><div class="box">
  <h2>Tournées impayés — accès protégé</h2>
  <p>Code d'accès fourni avec le lien.</p>
  <input id="code" inputmode="text" autocomplete="off" placeholder="CODE">
  <button id="go">Ouvrir la carte</button>
  <div class="err" id="err"></div>
  <a href="#" id="cfg" style="display:block;margin-top:14px;font-size:11px;color:#9fb3c8;text-decoration:none">⚙ synchronisation Google Sheets</a>
</div></div>
<div id="map"></div>
<header>
  <div>
    <h1>Impayés incendie — tournées</h1>
    <div class="sub" id="sub"></div>
  </div>
  <button id="toggle">Liste</button>
</header>
<a id="fab" target="_blank" rel="noopener"></a>
<div id="panel">
  <div id="grab"><span></span></div>
  <div class="chips" id="chips"></div>
  <div id="liste"></div>
  <footer>Base TPMC Riom · ordre optimisé (OSRM) · les clients réglés / visités sont masqués sur cet appareil</footer>
</div>

<script>const ITER = 150000;
  const SYNC_TOKEN = 'c74865658234de2de38c92ab';
  const SYNC_URL_DEFAUT = 'https://script.google.com/macros/s/AKfycbxQrzH9OyNshAzaqCX8qI58w5LlS1r6kKnCcTkypGEdm_aZAOLxkny4SmAu1ODle6gn/exec';   // rempli au déploiement d'Apps Script
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function dechiffrer(code) {
  const brut = b64(document.getElementById('blob').textContent.trim());
  const salt = brut.slice(0,16), nonce = brut.slice(16,28), ct = brut.slice(28);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256'}, base,
    {name:'AES-GCM', length:256}, false, ['decrypt']);
  const clair = await crypto.subtle.decrypt({name:'AES-GCM', iv:nonce}, key, ct);
  return JSON.parse(new TextDecoder().decode(clair));
}

// les libellés viennent de la base client : on échappe avant toute injection HTML
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const eur = v => v.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const hhmm = m => { const h = Math.floor(m/60), r = Math.round(m%60); return (h ? h + ' h ' : '') + (r ? r + ' min' : (h ? '' : '0 min')); };

function demarrer(DATA) {
  document.getElementById('gate').style.display = 'none';

  /* ---------- marquage local (réglé / déjà visité) ---------- */
  const CLE = 'tpmc_marques_v1';
  let MARQUES = {};
  try { MARQUES = JSON.parse(localStorage.getItem(CLE) || '{}') || {}; } catch (e) { MARQUES = {}; }
  const sauver = () => { try { localStorage.setItem(CLE, JSON.stringify(MARQUES)); } catch (e) {} };

  /* ---------- synchronisation Google Sheets (Apps Script) ---------- */
  let etatSync = 'off';                       // 'off' | 'ok' | 'ko'
  const urlSync = () => ((localStorage.getItem('tpmc_sync_url') || SYNC_URL_DEFAUT) || '').trim();

  function jsonp(url) {
    return new Promise((ok, ko) => {
      const cb = 'cbtpmc_' + Math.floor(Math.random() * 1e9);
      let fini = false;
      const s = document.createElement('script');
      window[cb] = d => { fini = true; ok(d); try { delete window[cb]; } catch (e) {} s.remove(); };
      s.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + cb;
      s.onerror = () => { if (!fini) { fini = true; ko(new Error('réseau')); s.remove(); } };
      document.body.appendChild(s);
      setTimeout(() => { if (!fini) { fini = true; ko(new Error('délai')); } }, 12000);
    });
  }

  function pousser(action, code) {
    const u = urlSync();
    if (!u) return;
    const p = DATA.points.find(x => x.id === code);
    const q = new URLSearchParams({
      token: SYNC_TOKEN, action: action, code: code,
      nom: p ? p.n : '', montant: p ? p.m : 0,
      type: (MARQUES[code] || {}).t || ''
    });
    // balise GET : Apps Script renvoie une 302 sur /exec, un POST y perdrait son corps
    try { const img = new Image(); img.src = u + (u.indexOf('?') >= 0 ? '&' : '?') + q.toString(); } catch (e) {}
  }

  async function synchroniser() {
    const u = urlSync();
    if (!u) { etatSync = 'off'; majEntete(); return; }
    try {
      const r = await jsonp(u + (u.indexOf('?') >= 0 ? '&' : '?') + 'token=' + encodeURIComponent(SYNC_TOKEN));
      if (!r || !r.ok || !Array.isArray(r.marques)) { etatSync = 'ko'; majEntete(); return; }
      let change = false;
      r.marques.forEach(m => {
        const loc = MARQUES[m.code];
        if (!loc) { MARQUES[m.code] = {t: m.type, d: m.date}; change = true; }
        else if (m.date && loc.d && m.date > loc.d) { MARQUES[m.code] = {t: m.type, d: m.date}; change = true; }
      });
      // les marques prises hors ligne et jamais remontées sont poussées maintenant
      Object.keys(MARQUES).forEach(c => {
        if (!r.marques.some(m => m.code === c)) pousser('marquer', c);
      });
      if (change) sauver();
      etatSync = 'ok';
      rafraichir();
    } catch (e) {
      etatSync = 'ko';
      majEntete();
    }
  }

  const map = L.map('map', {zoomControl:false}).setView([45.78,3.12], 10);
  window._map = map;
  L.control.zoom({position:'bottomright'}).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  const layers = {}, traces = {}, markers = {};
  DATA.secteurs.forEach(s => { layers[s.nom] = L.layerGroup(); });
  DATA.routes.forEach(r => {
    if (!r.geo || !r.geo.length) return;
    traces[r.s] = L.polyline(r.geo.map(([lon,lat]) => [lat,lon]),
      {color:'#'+r.c, weight:4, opacity:0.62, lineJoin:'round'}).addTo(layers[r.s]);
  });

  const actifs = new Set(DATA.secteurs.map(s => s.nom));
  const km = (a, b) => {
    const R = 6371, dLat = (b[0]-a[0])*Math.PI/180, dLon = (b[1]-a[1])*Math.PI/180;
    const h = Math.sin(dLat/2)**2 + Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(h));
  };
  const base = DATA.base || [45.8936, 3.1140];
  const reste = p => !MARQUES[p.id];
  const secteurReste = nom => DATA.points.filter(p => p.s === nom && reste(p)).sort((a,b)=>a.o-b.o);

  function lienTournee(stops) {
    if (!stops.length) return null;
    const pts = [base[0].toFixed(6) + ',' + base[1].toFixed(6)]
      .concat(stops.map(p => p.lat.toFixed(6) + ',' + p.lon.toFixed(6)));
    return 'https://www.google.com/maps/dir/' + pts.join('/');
  }

  function popupHTML(p) {
    const tel = (p.p || p.t || '').replace(/[^0-9+]/g,'');
    const leg = (p.km != null && p.ckm != null) ? `+${p.km.toFixed(1).replace('.',',')} km / ${p.min} min · cumul ${p.ckm.toFixed(1).replace('.',',')} km` : '';
    const rlx = p.r || 0;
    return `<div class="pop">
      <h3>${esc(p.n)}</h3>
      <div class="amt">${eur(p.m)} · ${esc(p.f.join(', '))}</div>
      <div class="adr">${esc(p.a || '')}<br>${esc(p.cp)} ${esc(p.v)}</div>
      ${p.k ? 'Contact : ' + esc(p.k) + '<br>' : ''}
      ${p.t ? 'Tél. ' + esc(p.t) + '<br>' : ''}${p.p ? 'Mobile ' + esc(p.p) : ''}
      <div style="color:#8a99a8;font-size:11px;margin-top:6px">arrêt n°${p.o} · retard ${rlx} j</div>
      ${leg ? '<div style="color:#5b6b7b;font-size:11px">' + leg + '</div>' : ''}
      <a class="btn" target="_blank" rel="noopener"
         href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}">Y aller</a>
      ${tel ? `<a class="btn" style="background:#1c6b34" href="tel:${tel}">Appeler</a>` : ''}
      <a class="btn paye" href="#" data-marque="paye" data-code="${p.id}">✓ Réglé</a>
      <a class="btn passe" href="#" data-marque="passe" data-code="${p.id}">✓ Passé</a>
    </div>`;
  }

  function poserMarqueur(p) {
    const ic = L.divIcon({className:'', html:`<div class="pin" style="background:#${p.c}">${p.o}</div>`,
                          iconSize:[22,22], iconAnchor:[11,11], popupAnchor:[0,-10]});
    markers[p.id] = L.marker([p.lat,p.lon], {icon:ic}).bindPopup(popupHTML(p)).addTo(layers[p.s]);
  }

  function majEntete() {
    const rest = DATA.points.filter(reste);
    const payes = DATA.points.filter(p => MARQUES[p.id] && MARQUES[p.id].t === 'paye');
    const passes = DATA.points.filter(p => MARQUES[p.id] && MARQUES[p.id].t === 'passe');
    const du = rest.reduce((a,p) => a + p.m, 0);
    let t = `${rest.length} clients restants · ${eur(du)}`;
    if (payes.length || passes.length) t += ` · ${payes.length} réglé(s) · ${passes.length} passé(s)`;
    if (etatSync === 'ok') t += ' · ☁ partagé';
    else if (etatSync === 'ko') t += ' · ⚠ hors ligne';
    document.getElementById('sub').textContent = t;
  }

  function renderListe() {
    const box = document.getElementById('liste');
    let html = '';
    DATA.secteurs.filter(s => actifs.has(s.nom)).forEach(s => {
      const pts = secteurReste(s.nom);
      const marques = DATA.points.filter(p => p.s === s.nom && !reste(p)).sort((a,b)=>a.o-b.o);
      const du = pts.reduce((a,p)=>a+p.m,0);
      html += `<div class="sec">
        <div class="t"><span class="dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#${s.couleur};margin-right:6px"></span>${esc(s.nom)}</div>
        <div class="stats">${pts.length} restants · ${eur(du)}${marques.length ? ' · ' + marques.length + ' traité(s)' : ''} · ${(s.km||0).toFixed(0)} km</div>`;
      const lien = lienTournee(pts);
      if (lien) {
        html += `<a class="go" href="${lien}" target="_blank" rel="noopener">🧭 Démarrer la tournée — ${pts.length} arrêt(s) restant(s)</a>`;
      } else {
        html += `<div class="go off">Secteur terminé ✔</div>`;
      }
      html += '</div>';
      pts.forEach(p => {
        const tel = (p.p || p.t || '').replace(/[^0-9+]/g,'');
        const leg = (p.km != null && p.ckm != null) ? `+${p.km.toFixed(1).replace('.',',')} km · ${p.min} min · cumul ${p.ckm.toFixed(0)} km / ${hhmm(p.cmin)}` : '';
        html += `<div class="row">
          <div class="num" style="background:#${p.c}">${p.o}</div>
          <div class="txt">
            <div class="n">${esc(p.n)} <span class="m" style="float:right">${eur(p.m)}</span></div>
            <div class="a">${esc(p.a || '—')} · ${esc(p.cp)} ${esc(p.v)}</div>
            ${leg ? `<div class="leg">${leg}</div>` : ''}
            <div class="act">
              <a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}" target="_blank" rel="noopener">Y aller</a>
              ${tel ? `<a class="call" href="tel:${tel}">Appeler</a>` : ''}
              <a href="#" data-marque="paye" data-code="${p.id}" class="paye">Réglé</a>
              <a href="#" data-marque="passe" data-code="${p.id}" class="passe">Passé</a>
            </div>
          </div></div>`;
      });
      if (marques.length) {
        html += `<div class="traites"><div class="t">Traités (${marques.length})</div>`;
        marques.forEach(p => {
          const t = MARQUES[p.id].t;
          const date = (MARQUES[p.id].d || '').slice(0,10).split('-').reverse().join('/');
          html += `<div class="tr">
            <span class="badge" style="background:${t === 'paye' ? '#1c6b34' : '#2b4a68'}">${t === 'paye' ? 'réglé' : 'passé'}</span>
            <b>${esc(p.n)}</b> ${eur(p.m)} ${date ? '· ' + date : ''}
            <a href="#" data-demarque="${p.id}">rétablir</a></div>`;
        });
        html += '</div>';
      }
    });

    // récapitulatif des marques, tous secteurs confondus
    const allMarques = DATA.points.filter(p => !reste(p));
    if (allMarques.length) {
      html += `<div class="traites" style="border-top:2px solid #eef2f5;margin-top:18px">
        <div class="t">Point du jour — ${allMarques.length} client(s)
          <a href="#" id="envoyer">partager</a></div>`;
      html += `<div class="stats">${allMarques.filter(p=>MARQUES[p.id].t==='paye').length} réglé(s) · ${eur(allMarques.filter(p=>MARQUES[p.id].t==='paye').reduce((a,p)=>a+p.m,0))}
        · ${allMarques.filter(p=>MARQUES[p.id].t==='passe').length} visité(s) sans paiement</div>`;
      html += `<a href="#" id="toutretablir" style="display:block;margin-top:8px;font-size:11px;color:#8a99a8;text-decoration:none">réafficher tous les clients</a></div>`;
    }
    box.innerHTML = html;

    box.querySelectorAll('[data-demarque]').forEach(a => a.addEventListener('click', e => {
      e.preventDefault();
      delete MARQUES[a.dataset.demarque];
      sauver(); pousser('supprimer', a.dataset.demarque); rafraichir();
    }));
    const env = box.querySelector('#envoyer');
    if (env) env.addEventListener('click', e => { e.preventDefault(); partager(); });
    const tout = box.querySelector('#toutretablir');
    if (tout) tout.addEventListener('click', e => {
      e.preventDefault();
      if (confirm('Réafficher tous les clients marqués ?')) {
        const codes = Object.keys(MARQUES);
        MARQUES = {}; sauver();
        codes.forEach(c => pousser('supprimer', c));
        rafraichir();
      }
    });
  }

  function textePoint() {
    const marques = DATA.points.filter(p => !reste(p));
    const payes = marques.filter(p => MARQUES[p.id].t === 'paye');
    const passes = marques.filter(p => MARQUES[p.id].t === 'passe');
    const montant = payes.reduce((a,p) => a + p.m, 0);
    const d = new Date().toLocaleDateString('fr-FR');
    let t = `Point tournée impayés ${d} : ${payes.length} réglé(s) (${eur(montant)}), ${passes.length} visité(s) sans paiement.\n`;
    if (payes.length) t += '\nRéglés :\n' + payes.map(p => `- ${p.n} (${eur(p.m)})`).join('\n');
    if (passes.length) t += '\n\nPassés :\n' + passes.map(p => `- ${p.n} (${eur(p.m)})`).join('\n');
    return t;
  }

  function partager() {
    const txt = textePoint();
    if (navigator.share) { navigator.share({title:'Point tournée impayés', text:txt}).catch(()=>{}); return; }
    window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
  }

  function majFab() {
    const fab = document.getElementById('fab');
    const seul = (actifs.size === 1) ? [...actifs][0] : null;
    if (!seul) { fab.style.display = 'none'; fab.removeAttribute('href'); return; }
    const pts = secteurReste(seul);
    const s = DATA.secteurs.find(x => x.nom === seul);
    if (!pts.length) {
      fab.href = '#'; fab.style.background = '#8a99a8';
      fab.innerHTML = `Secteur terminé ✔<small>${esc(seul)} — tout est réglé ou visité</small>`;
    } else {
      fab.href = lienTournee(pts); fab.style.background = '#1c6b34';
      fab.innerHTML = `🧭 Démarrer la tournée<small>${esc(seul)} · ${pts.length} arrêt(s) · ${(s.km||0).toFixed(0)} km</small>`;
    }
    fab.style.display = 'block';
  }

  function rafraichir() {
    DATA.points.forEach(p => {
      const dedans = layers[p.s].hasLayer ? layers[p.s].hasLayer(markers[p.id]) : false;
      if (reste(p) && !markers[p.id]) poserMarqueur(p);
      else if (reste(p) && markers[p.id] && !dedans) layers[p.s].addLayer(markers[p.id]);
      else if (!reste(p) && markers[p.id] && dedans) layers[p.s].removeLayer(markers[p.id]);
    });
    majEntete(); renderListe(); majFab();
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('off', !actifs.has(c.dataset.nom)));
  }

  // actions sur un client (liste et bulle)
  document.addEventListener('click', e => {
    const m = e.target.closest('[data-marque]');
    if (m) {
      e.preventDefault();
      MARQUES[m.dataset.code] = {t: m.dataset.marque, d: new Date().toISOString()};
      sauver(); pousser('marquer', m.dataset.code); map.closePopup(); rafraichir();
    }
  });

  // affichage initial des marqueurs
  DATA.points.forEach(p => { if (reste(p)) poserMarqueur(p); });

  const chips = document.getElementById('chips');
  const bornesSecteur = nom => L.latLngBounds(DATA.points.filter(p => p.s === nom).map(p => [p.lat, p.lon]));
  const proches = DATA.secteurs.filter(s => {
    const pts = DATA.points.filter(p => p.s === s.nom);
    if (!pts.length) return false;
    const c = [pts.reduce((a,p)=>a+p.lat,0)/pts.length, pts.reduce((a,p)=>a+p.lon,0)/pts.length];
    return km(base, c) <= 80;
  }).map(s => s.nom);
  const visibles = DATA.points.filter(p => proches.includes(p.s));
  const bornes = L.latLngBounds((visibles.length ? visibles : DATA.points).map(p => [p.lat, p.lon]));

  DATA.secteurs.forEach(s => {
    const d = document.createElement('div');
    d.className = 'chip';
    d.dataset.nom = s.nom;
    d.innerHTML = `<b><span class="dot" style="background:#${s.couleur}"></span>${esc(s.nom.split(' · ')[1] || s.nom)}</b>${secteurReste(s.nom).length} restants · ${(s.km||0).toFixed(0)} km`;
    d.addEventListener('click', () => {
      const seul = (actifs.size === 1 && actifs.has(s.nom));
      if (seul) {
        actifs.clear();
        DATA.secteurs.forEach(x => { actifs.add(x.nom); map.addLayer(layers[x.nom]); });
        map.fitBounds(bornes, {padding:[40,40]});
      } else {
        actifs.clear(); actifs.add(s.nom);
        DATA.secteurs.forEach(x => { if (x.nom === s.nom) map.addLayer(layers[x.nom]); else map.removeLayer(layers[x.nom]); });
        map.fitBounds(bornesSecteur(s.nom), {padding:[45,45], maxZoom:14});
      }
      document.querySelectorAll('.chip').forEach(c => c.classList.toggle('off', !actifs.has(c.dataset.nom)));
      renderListe(); majFab();
    });
    chips.appendChild(d);
  });
  DATA.secteurs.forEach(x => map.addLayer(layers[x.nom]));

  document.getElementById('toggle').addEventListener('click', () => {
    document.getElementById('panel').classList.toggle('open');
  });
  document.getElementById('grab').addEventListener('click', () => {
    document.getElementById('panel').classList.toggle('open');
  });

  const LocateCtl = L.Control.extend({
    options: {position:'bottomright'},
    onAdd: function() {
      const btn = L.DomUtil.create('div','leaflet-bar leaflet-control');
      btn.innerHTML = '<a href="#" title="Ma position" style="font-size:17px;line-height:26px;text-align:center;width:30px;height:30px;display:block">◎</a>';
      btn.onclick = e => { e.preventDefault();
        navigator.geolocation.getCurrentPosition(pos => {
          const ll = [pos.coords.latitude, pos.coords.longitude];
          if (window._me) map.removeLayer(window._me);
          window._me = L.circleMarker(ll, {radius:8, color:'#fff', weight:3, fillColor:'#1a73e8', fillOpacity:1}).addTo(map);
          map.setView(ll, 14);
        }, () => alert('Position indisponible'));
      };
      return btn;
    }
  });
  map.addControl(new LocateCtl());

  majEntete(); renderListe(); majFab();
  synchroniser();

  // Premier cadrage : attendre une taille réelle, et cadrer sans animation
  let fitFait = false;
  function cadrer() {
    if (fitFait) return true;
    const taille = map.getSize();
    if (taille.x < 200 || taille.y < 200) return false;
    map.invalidateSize();
    map.fitBounds(bornes, {padding:[40,40], animate:false});
    fitFait = true;
    return true;
  }
  cadrer();
  const veille = setInterval(() => { if (cadrer()) clearInterval(veille); }, 100);
  setTimeout(() => clearInterval(veille), 4000);
  window.addEventListener('load', () => { cadrer(); map.invalidateSize(); });
  window.addEventListener('resize', () => map.invalidateSize());
  window.addEventListener('orientationchange', () => setTimeout(() => map.invalidateSize(), 300));
}

async function tenter(code) {
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const data = await dechiffrer(code.trim().toUpperCase());
    demarrer(data);
    try { history.replaceState(null,'', '#c=' + encodeURIComponent(code.trim().toUpperCase())); } catch(e) {}
  } catch (e) {
    err.textContent = "Code incorrect.";
  }
}

document.getElementById('cfg').addEventListener('click', e => {
  e.preventDefault();
  const actuel = localStorage.getItem('tpmc_sync_url') || SYNC_URL_DEFAUT || '';
  const u = prompt('URL du deployement Apps Script (elle finit par /exec). Laisser vide pour desactiver.', actuel);
  if (u !== null) {
    localStorage.setItem('tpmc_sync_url', u.trim());
    alert(u.trim() ? 'Synchronisation configurée. Recharge la page.' : 'Synchronisation désactivée.');
  }
});
document.getElementById('go').addEventListener('click', () => tenter(document.getElementById('code').value));
document.getElementById('code').addEventListener('keydown', e => { if (e.key === 'Enter') tenter(e.target.value); });
const m = location.hash.match(/c=([^&]+)/);
if (m) { const c = decodeURIComponent(m[1]); document.getElementById('code').value = c; tenter(c); }
</script>
</body>
